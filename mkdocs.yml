site_name: eval-toolkit
site_description: >
  Methodology-aware evaluation harness for binary classification:
  metrics, bootstrap CIs, calibration, leakage detection, splitting,
  threshold selection, dataset loading, and reproducibility manifests.
site_author: Brandon Behring
site_url: https://brandon-behring.github.io/eval-toolkit/
repo_url: https://github.com/brandon-behring/eval-toolkit
repo_name: brandon-behring/eval-toolkit
edit_uri: edit/main/docs/

# Per the v0.28.0 design Q11=A: single-version site, no mike.
# Reversible later: switching to mike adds /<version>/ subdirectories
# without breaking the root URL.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
  palette:
    # Auto light / dark switching via OS preference + manual toggle
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_signature_annotations: true
            separate_signature: true
            show_root_heading: true
            show_root_toc_entry: false
            show_source: false
            members_order: source
            heading_level: 2
            filters:
              - "!^_"  # hide private symbols even if exported in __all__

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      toc_depth: 3
  - footnotes
  - tables

# Per v0.28.0 design Q12=B: MathJax v3 + tikzjax for full LaTeX +
# TikZ-in-docstrings support. Tradeoff: ~200KB JS + ~100ms first-paint
# render flash, acceptable for the math-heavy docstrings.
extra_javascript:
  - javascripts/mathjax-config.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://tikzjax.com/v1/tikzjax.js

extra_css:
  - https://tikzjax.com/v1/fonts.css

nav:
  - Home: index.md
  - What's new: whats-new.md
  - Getting started: getting-started.md
  - Examples:
      - Overview: examples/index.md
      - Metrics + bootstrap: examples/metrics_and_bootstrap.md
      - Evaluate harness: examples/evaluate_harness.md
      - Calibration: examples/calibration.md
      - Leakage detection: examples/leakage_detection.md
      - Claims + gates: examples/claims_and_gates.md
      - Paired comparison: examples/paired_comparison.md
      - Prompt-injection walkthrough: examples/prompt_injection_walkthrough.md
      - PyTorch scorer: examples/pytorch_scorer_example.md
  - Methodology:
      - Overview: methodology/README.md
      - Splits: methodology/splits.md
      - Comparison: methodology/comparison.md
      - Reproducibility: methodology/reproducibility.md
      - Claims + evidence: methodology/claims.md
      - Artifacts: methodology/artifacts.md
      - Evidence: methodology/evidence.md
      - Text dedup: methodology/text_dedup.md
  - Schemas: schemas.md
  - Migration:
      - v0.7: migration/v0.7.md
      - v0.8: migration/v0.8.md
      - v0.9: migration/v0.9.md
  - Extending: extending.md
  - Roadmap: roadmap.md
  - API reference:
      - Overview: api/index.md
      - analysis: api/analysis.md
      - artifacts: api/artifacts.md
      - bootstrap: api/bootstrap.md
      - calibration: api/calibration.md
      - claims: api/claims.md
      - config: api/config.md
      - docs: api/docs.md
      - evidence: api/evidence.md
      - harness: api/harness.md
      - leakage: api/leakage.md
      - loaders: api/loaders.md
      - manifest: api/manifest.md
      - metrics: api/metrics.md
      - operating_points: api/operating_points.md
      - paths: api/paths.md
      - plotting: api/plotting.md
      - protocols: api/protocols.md
      - provenance: api/provenance.md
      - seeds: api/seeds.md
      - splits: api/splits.md
      - text_dedup: api/text_dedup.md
      - thresholds: api/thresholds.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/brandon-behring/eval-toolkit
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/eval-toolkit/
