# Dependabot configuration for eval-toolkit.
#
# Grouping policy (per /exploring-options Q2):
#   - minor + patch updates bundled into one PR per ecosystem per week
#     (low-risk; one rubber-stamp merge replaces ~10 individual PRs)
#   - major-version bumps stay separate (breaking changes need review)
#
# This replaces the prior plan's "quarterly pre-commit version bump task" —
# Dependabot will auto-bump the pre-commit floor via the pip ecosystem.

version: 2
updates:
  # Python dependencies in pyproject.toml
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      # One PR/week for all minor + patch pip updates; majors stay separate.
      pip-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # GitHub Actions versions in .github/workflows/*.yml
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
      include: scope
    groups:
      gha-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
