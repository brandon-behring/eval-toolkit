name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: latest

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv + install (with dev extras)
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install -e ".[dev]"

      - name: Lint (ruff)
        run: uv run python -m ruff check src tests

      - name: Format check (black)
        run: uv run python -m black --check src tests

      - name: Type check (mypy strict)
        run: uv run python -m mypy src

      - name: Run tests with coverage
        run: uv run python -m pytest --cov=eval_toolkit --cov-fail-under=92

      - name: Run doctests on math kernels + utility modules
        run: |
          uv run python -m pytest --doctest-modules \
            src/eval_toolkit/metrics.py \
            src/eval_toolkit/bootstrap.py \
            src/eval_toolkit/calibration.py \
            src/eval_toolkit/text_dedup.py \
            src/eval_toolkit/thresholds.py \
            src/eval_toolkit/leakage.py \
            src/eval_toolkit/manifest.py \
            src/eval_toolkit/paths.py \
            src/eval_toolkit/provenance.py \
            src/eval_toolkit/seeds.py \
            src/eval_toolkit/docs.py

      - name: Validate JSON Schemas (jsonschema)
        run: |
          uv run python -c "
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          import eval_toolkit
          schemas_dir = Path(eval_toolkit.__file__).parent / 'schemas'
          for schema_file in sorted(schemas_dir.glob('*.json')):
              schema = json.loads(schema_file.read_text())
              Draft202012Validator(schema)  # constructor validates against meta-schema
              print(f'  {schema_file.name}: OK')
          "

      - name: Visual regression (pytest-mpl)
        if: matrix.os != 'windows-latest'
        run: uv run python -m pytest --mpl tests/test_plotting_visual.py
