name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: latest

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv + install (with dev extras)
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install -e ".[dev]"

      - name: Lint (ruff)
        run: uv run python -m ruff check src tests

      - name: Format check (black)
        run: uv run python -m black --check src tests

      - name: Type check (mypy strict)
        run: uv run python -m mypy src

      - name: Run tests with coverage
        run: uv run python -m pytest --cov=eval_toolkit --cov-fail-under=92

      - name: Run doctests on math kernels + utility modules
        # Reads .doctest-modules (canonical list, shared with Makefile /
        # noxfile.py / tox.ini). `tr -d '\r'` strips any CR injected by
        # Git's autocrlf on Windows runners (belt-and-suspenders alongside
        # the .gitattributes `eol=lf` enforcement). xargs then expands the
        # cleaned list as pytest args.
        run: tr -d '\r' < .doctest-modules | xargs uv run python -m pytest --doctest-modules

      - name: Validate JSON Schemas (Draft 2020-12 meta-validation)
        run: uv run eval-toolkit schemas check

      - name: Visual regression (pytest-mpl)
        if: matrix.os != 'windows-latest'
        run: uv run python -m pytest --mpl tests/test_plotting_visual.py

  test-base-install:
    # Verifies `pip install eval-toolkit` (no extras) actually works:
    # every public top-level import must succeed without the [dataframe],
    # [parquet], [plotting] extras installed. Regression guard for the
    # 0.27.1-era bug where unconditional `import pandas as pd` at module
    # top level broke `from eval_toolkit import evaluate` on base install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: latest

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Create base venv and install without extras
        run: |
          uv venv --python 3.13 .venv-base
          source .venv-base/bin/activate
          uv pip install .

      - name: Smoke import every public module (no extras installed)
        run: |
          source .venv-base/bin/activate
          python -c "import eval_toolkit; print('version:', eval_toolkit.__version__)"
          python -c "from eval_toolkit import evaluate, RunResult, EvalSlice"
          python -c "from eval_toolkit import pr_auc, bootstrap_ci, BootstrapCI"
          python -c "import eval_toolkit.harness"
          python -c "import eval_toolkit.loaders"
          python -c "import eval_toolkit.leakage"
          python -c "import eval_toolkit.splits"

      - name: Confirm pandas is NOT installed (sanity check on the gate)
        run: |
          source .venv-base/bin/activate
          if python -c "import pandas" 2>/dev/null; then
            echo "::error::pandas is installed in the base venv — the gate is not actually testing base install"
            exit 1
          fi
          echo "Confirmed: pandas not in base venv"
