name: Sphinx preview (v0.31.0 migration)

# Phase 1 of the v0.31.0 docs migration plan: builds the parallel Sphinx
# site (docs-preview/source/ → docs-preview/build/html/) and uploads it
# as a workflow artifact for visual comparison vs. the live mkdocs site.
#
# Does NOT deploy to Pages — the live site stays mkdocs-driven until the
# Phase 3 big-switch PR. This workflow exists only to give the maintainer
# a preview URL for each PR/push during Phase 2 content touch-up.
#
# Deleted in Phase 3 when docs-preview/source/ moves to docs/source/ and
# .github/workflows/docs.yml is rewritten to build Sphinx instead of mkdocs.

on:
  push:
    branches: [main]
    paths:
      - "docs-preview/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs-sphinx-preview.yml"
  pull_request:
    paths:
      - "docs-preview/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs-sphinx-preview.yml"
  workflow_dispatch: # manual trigger for ad-hoc rebuilds

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: latest

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Create venv + install with docs-preview extra
        run: |
          uv venv --python 3.13 .venv
          uv pip install -e ".[docs-preview]"

      - name: Build Sphinx site (warnings-as-errors)
        # Phase 2 will iterate until -W passes cleanly. Until then, the
        # build still tolerates warnings (no -W flag yet) so reviewers can
        # at least see the artifact. Flip to `-W` once Phase 2 completes.
        run: uv run sphinx-build -b html docs-preview/source/ docs-preview/build/html/

      - name: Upload Sphinx preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-preview-${{ github.sha }}
          path: docs-preview/build/html/
          retention-days: 7
