name: Publish to PyPI

# Triggered by pushing a `v*` tag, OR manually via workflow_dispatch
# (recovery path for failed tag-triggered runs; see RELEASING.md).
#
# Routing:
#   v*rc* / v*a* / v*b* / v*dev*  -> TestPyPI (rehearsal)
#   any other v*                  -> PyPI (real publish)
#
# Recovery path (workflow_dispatch):
#   When a tag-triggered run fails (e.g., GitHub Actions outage), this
#   workflow can be re-triggered manually. Use one of:
#     gh workflow run publish.yml --ref vX.Y.Z
#   OR via the Actions UI: 'Run workflow' -> select the tag from the
#   'Use workflow from' dropdown. The workflow always uses the file from
#   the default branch (main); the selected ref determines github.ref_name
#   and thus which version gets built/published.
#
# Uses PyPI Trusted Publishing (OIDC, no API tokens). Bound to the `pypi`
# and `testpypi` GitHub Environments — both must exist and have a matching
# pending-publisher entry configured on (test).pypi.org before first run.
#
# The CI gate is upstream: branch-protection on `main` requires the `CI`
# workflow green before merge, so any tagged commit is already CI-validated.
# This workflow runs `twine check --strict` plus a version-tag-match guard
# AND a post-publish PyPI-receipt verification (catches silent half-releases
# where the publish step succeeds but PyPI never receives the wheel).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: latest

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Resolve and set build version from tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(uv run --with hatchling python -c 'from eval_toolkit._version import __version__; print(__version__)')"

          # _version.py on main always carries the next planned stable version
          # (X.Y.Z). Tags may add a PEP 440 prerelease suffix (rcN, aN, bN,
          # .devN). The base release must match — otherwise the tag is for a
          # different version than the source intends.
          BASE_TAG="$(echo "$TAG" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          BASE_PKG="$(echo "$PKG" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          if [ "$BASE_TAG" != "$BASE_PKG" ]; then
            echo "::error::Tag base '${BASE_TAG}' (from '${GITHUB_REF_NAME}') does not match _version.py base '${BASE_PKG}' (from '${PKG}')" >&2
            exit 1
          fi

          # For prerelease tags, override _version.py for this build only so the
          # wheel filename and metadata carry the prerelease version. For stable
          # tags (TAG == PKG), no override is needed.
          if [ "$TAG" != "$PKG" ]; then
            echo "Prerelease build: overriding _version.py from '$PKG' to '$TAG'"
            sed -i.bak "s/^__version__ = \".*\"/__version__ = \"$TAG\"/" src/eval_toolkit/_version.py
            rm -f src/eval_toolkit/_version.py.bak
            VERIFY="$(uv run --with hatchling python -c 'from eval_toolkit._version import __version__; print(__version__)')"
            if [ "$VERIFY" != "$TAG" ]; then
              echo "::error::Version override failed: _version.py is '$VERIFY', expected '$TAG'" >&2
              exit 1
            fi
          fi
          echo "Build version: $TAG"

      - name: Build sdist + wheel
        run: uv build

      - name: Validate distributions
        run: uv tool run --from twine twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: contains(github.ref_name, 'rc') || contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'dev')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/eval-toolkit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  publish-pypi:
    needs: build
    if: "!contains(github.ref_name, 'rc') && !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') && !contains(github.ref_name, 'dev')"
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/eval-toolkit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

      # Verify that PyPI actually received the wheel for this tag.
      # Catches the failure mode where the publish step exits 0 but PyPI
      # never registers the version (CDN propagation lag, OIDC blip, or
      # PyPA action returning success on a partial upload). 12 × 30s =
      # 6-minute window matches PyPI's observed propagation under incident
      # conditions; fail-loud so the silent half-release is surfaced as a
      # workflow failure rather than a stuck tag.
      - name: Verify PyPI receipt
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          URL="https://pypi.org/pypi/eval-toolkit/${TAG}/json"
          for i in $(seq 1 12); do
            CODE=$(curl -sf "$URL" -o /dev/null -w "%{http_code}" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "PyPI confirms version $TAG (${URL} returned 200)"
              exit 0
            fi
            echo "Attempt $i/12: ${URL} returned $CODE, waiting 30s..."
            sleep 30
          done
          echo "::error::PyPI did not receive $TAG within 6 minutes (last status: $CODE). See RELEASING.md 'Recovering a failed publish' for next steps." >&2
          exit 1
