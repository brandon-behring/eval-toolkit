name: Nightly Benchmarks

# Weekly pytest-benchmark run on the math kernels.
# Tier γ #1 of v0.29.0 — catches perf regressions before release.
# Cron-only; runtime ~30s but adds CI noise if it runs on every PR.
#
# Output is uploaded as artifacts; comparison-to-baseline is manual
# for now (`pytest-benchmark compare`). Future: store a baseline JSON
# in-repo and assert each kernel runs within some multiple of it.

on:
  schedule:
    # Saturdays 02:00 UTC — different from nightly-mc (Sun 03:00) so
    # CI doesn't pile up
    - cron: "0 2 * * 6"
  workflow_dispatch: # allow manual trigger

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: latest

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Create venv + install dev extras (incl. pytest-benchmark)
        run: |
          uv venv --python 3.13 .venv
          uv pip install -e ".[dev]"

      - name: Run kernel benchmarks
        run: |
          uv run python -m pytest tests/benchmarks/ -m benchmark \
            --benchmark-only \
            --benchmark-min-rounds=10 \
            --benchmark-json=benchmark-results.json \
            -v --tb=short 2>&1 | tee benchmark-output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmark-results.json
            benchmark-output.txt
          retention-days: 90
