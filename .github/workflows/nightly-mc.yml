name: Nightly Monte Carlo

# Weekly Monte Carlo calibration of bootstrap_ci coverage + bias.
# Catches the class of bug that goldens can't: math that produces
# self-consistent wrong numbers. Pattern adapted from temporalcv's
# nightly-tests.yml (Behring, 2026).
#
# Why weekly (not nightly): the MC test suite takes ~10 minutes;
# bootstrap_ci changes rarely; weekly cadence balances early-detection
# of regressions against CI minutes.

on:
  schedule:
    # Sundays 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch: # allow manual trigger

permissions:
  contents: read

jobs:
  monte-carlo:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: latest

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Create venv + install with dev extras
        run: |
          uv venv --python 3.13 .venv
          uv pip install -e ".[dev]"

      - name: Run Monte Carlo bootstrap calibration tests
        run: |
          uv run python -m pytest tests/test_bootstrap_calibration_mc.py \
            -v -m slow --tb=short 2>&1 | tee mc-results.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-results
          path: mc-results.txt
          retention-days: 30

      - name: Fail if any MC test failed
        run: |
          if grep -q "FAILED" mc-results.txt; then
            echo "::error::Monte Carlo calibration test failed — see artifact for details."
            exit 1
          fi
