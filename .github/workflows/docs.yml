name: Deploy docs

# Builds + deploys the Sphinx + pydata-sphinx-theme site to GitHub
# Pages on every push to main and on tag pushes. Single-version (no
# sphinx-multiversion) per the v0.31.0 plan Q5=A.
#
# Replaces the v0.28.0 mkdocs-material workflow as of v0.31.0; see
# CHANGELOG and ~/.claude/plans/what-do-we-need-synchronous-turtle.md
# for the migration rationale.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: # manual trigger for ad-hoc rebuilds

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent docs deployment, but queue subsequent runs so
# the latest push always wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: latest

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Create venv + install with all extras + docs
        # `[all,docs]` so autosummary can import every public module
        # at docs-build time (plotting needs matplotlib; loaders need
        # pandas+pyarrow; etc.). PEP 685 self-referencing extras keep
        # this DRY against the `[all]` in pyproject.toml.
        run: |
          uv venv --python 3.13 .venv
          uv pip install -e ".[all,docs]"

      - name: Build Sphinx site
        # NOTE: --strict (-W) is not enabled yet — Phase 2 of the v0.31.0
        # migration left ~56 advisory warnings (mostly MyST xref-missing
        # false-positives for anchors that DO resolve correctly in HTML,
        # plus per-doc duplicate-label warnings from sibling methodology
        # docs sharing anchor names like `pitfalls`). Future polish to
        # zero-warning state will flip `-W` back on.
        run: uv run sphinx-build -b html docs/source/ docs/build/html/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/html

  deploy:
    # Gate to main + manual dispatch only. The github-pages environment
    # has a branch-protection rule that rejects tag pushes (every tag
    # release was producing a red "X" on this workflow). Keeping the
    # `build` job on tag pushes preserves the docs-build-on-tag
    # validation (Sphinx renders cleanly at the released commit) while
    # avoiding the inevitable deploy-step failure.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
