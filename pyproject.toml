[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-toolkit"
version = "0.20.0"
description = "Reusable evaluation contracts for binary classification: metrics, bootstrap CIs, calibration, artifacts, and evidence gates."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Brandon Behring" },
]
keywords = [
    "machine-learning",
    "evaluation",
    "metrics",
    "bootstrap",
    "calibration",
    "binary-classification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    # v0.16.0 (F9.1): jsonschema is now a hard dep so validate_manifest /
    # validate_results / validate_prediction_artifact_ref are always
    # available without an optional extra. Schema validation is the
    # NeurIPS-aligned manifest contract; the optional-extra split forced
    # consumers to install [validation] just to run the toolkit safely.
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dataframe = ["pandas>=2.0"]
plotting = ["matplotlib>=3.8", "pillow>=10.0"]
property = ["hypothesis>=6.100"]
yaml = ["pyyaml>=6.0"]
parquet = ["pyarrow>=15.0"]
# Retained as a transitive no-op so [eval-toolkit[validation]] / dev still
# resolve cleanly; jsonschema is now in the base deps. Remove in v0.17.0
# after a deprecation window if no downstream consumer complains.
validation = []
# `all` references the sub-extras directly (PEP 685 self-reference). This
# avoids drift: adding a dep to e.g. `dataframe` no longer requires a
# mirroring edit here.
all = ["eval-toolkit[dataframe,plotting,property,yaml,parquet,validation]"]
dev = [
    "eval-toolkit[all]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mpl>=0.16",
    "sybil>=10.0",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
]

[project.scripts]
eval-toolkit = "eval_toolkit.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_toolkit"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "STYLE.md",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",   # line length handled by black
    "N803",   # function arg lowercase — math kernels use π, T, etc. per Decision 14
    "N806",   # variable name lowercase — same reason
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["eval_toolkit"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "matplotlib.*", "pandas.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "README.md", "docs"]

python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
markers = [
    "unit: Sklearn-reference and analytical correctness tests",
    "property: Hypothesis property-based invariant tests",
    "smoke: End-to-end smoke tests",
    "golden: Snapshot tests for deterministic outputs (docs.py)",
    "slow: Tests > 2s (bootstrap-t studentized, multi-seed K-fold). Opt out with `pytest -m 'not slow'`.",
]

[tool.coverage.run]
source = ["src/eval_toolkit"]
branch = true

[tool.coverage.report]
# Raised to 92 in v0.10.0 after the per-module coverage chase (every
# src/eval_toolkit/*.py now ≥90% individually; aggregate ~95%).
# Restored to 90 in v0.7.1, was 85 temporarily in v0.7.0.
fail_under = 92
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
