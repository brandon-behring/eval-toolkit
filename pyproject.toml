[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-toolkit"
dynamic = ["version"]
description = "Reusable evaluation contracts for binary classification: metrics, bootstrap CIs, calibration, artifacts, and evidence gates."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Brandon Behring" },
]
keywords = [
    "machine-learning",
    "evaluation",
    "metrics",
    "bootstrap",
    "calibration",
    "binary-classification",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    # v0.16.0 (F9.1): jsonschema is now a hard dep so validate_manifest /
    # validate_results / validate_prediction_artifact_ref are always
    # available without an optional extra. Schema validation is the
    # NeurIPS-aligned manifest contract; the optional-extra split forced
    # consumers to install [validation] just to run the toolkit safely.
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dataframe = ["pandas>=2.0"]
plotting = ["matplotlib>=3.8", "pillow>=10.0"]
property = ["hypothesis>=6.100"]
yaml = ["pyyaml>=6.0"]
parquet = ["pyarrow>=15.0"]
# v0.33.1: MiniLM convenience embedder for EmbeddingCosineStrategy.
# sentence-transformers transitively pulls torch + tokenizers (~700MB).
# Intentionally NOT in [all] / [dev] — opt-in only to keep contributor
# setup small. The canonical semantic-dedup recipe (all-MiniLM-L6-v2 +
# cosine@0.80) is what this factory pre-wires for callers.
embeddings = ["sentence-transformers>=3.0"]
# v0.37.0: TokenizationLeakageCheck — HF-tokenizer-aware dedup.
# transformers transitively pulls torch + tokenizers (~700MB) so we
# follow the [embeddings] precedent: opt-in only, NOT in [all] / [dev].
# Consumers pass an already-instantiated tokenizer callable; the check
# itself does not import transformers, so the optional install is
# strictly for callers wanting AutoTokenizer.from_pretrained(...).
transformers = ["transformers>=4.0"]
# v0.43.0: ActivationDeltaProbe (TaskTracker-style linear activation probe;
# closes #53). Pulls torch + transformers (~600MB+ transitive). Follows
# the [embeddings] precedent: opt-in only, NOT in [all] / [dev]. Module
# is base-install-safe (lazy imports inside ActivationDeltaProbe methods);
# the extra is strictly for callers wanting to actually fit / predict.
probes = ["torch>=2.0", "transformers>=4.40"]
# v0.44.0: RecallAtLowFPR loss (Meta Prompt Guard 2 recipe; closes #50).
# torch-only (no transformers); separated from [probes] per Decision 4
# (granular extras — losses callers should not have to install the larger
# transformers stack). Shares the torch version pin with [probes].
losses = ["torch>=2.0"]
# v1.5.0 (feat/eda-data-audit): eval_toolkit.eda Job-1 integrity-gate layer.
# Tier-2 surface (ADR 0003) — torch-free by design. pandas powers the
# DataFrameLoader reuse path; matplotlib is reserved for the EDA layer's
# future profiling plots. Intentionally NO sentence-transformers / torch:
# the near-dup / cross-split checks use the lexical TfidfCosineStrategy and
# token-length quantiles take a caller-supplied tokenizer (no transformers
# import in this module). NOT folded into [all] / [dev] — opt-in only.
eda = ["pandas>=2.0", "matplotlib>=3.8"]
# NO-OP extra kept for backward compatibility (R3 at v0.49.0).
#
# jsonschema>=4.21 moved to base deps at v0.16.0; this extra has been a
# no-op ever since. Originally announced as deprecated in v0.30.1 with
# target removal at v0.33.0, but reclassified at v0.49.0 (R3 in
# docs/DEPRECATION.md) as a permanent no-op — hard removal would break
# consumer pip pins of the form `eval-toolkit[validation]` for zero
# functional benefit. Retained indefinitely.
validation = []
# v0.31.0 docs site: Sphinx + pydata-sphinx-theme (replaces v0.28.0's
# mkdocs-material). Migration drivers — pain points Q1 in the v0.31.0
# plan: look-and-feel (scientific-Python convention), thin auto-API
# (autosummary per-symbol pages), and live cross-refs to numpy / scipy /
# sklearn (intersphinx). myst-nb runs example cells at docs-build time
# with cache mode. See ~/.claude/plans/what-do-we-need-synchronous-turtle.md
# for the full Q1-Q13 decision log.
docs = [
    "sphinx>=7.3",
    "pydata-sphinx-theme>=0.16",
    "myst-nb>=1.1",                  # MyST Markdown + Jupyter-style execution (Q9)
    "jupyter-cache>=1.0",            # myst-nb execution cache backend (Q11)
    "linkify-it-py>=2.0",            # needed for myst_enable_extensions = [..., "linkify", ...]
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "sphinx-autodoc-typehints>=2.0",
]
# `all` references the sub-extras directly (PEP 685 self-reference). This
# avoids drift: adding a dep to e.g. `dataframe` no longer requires a
# mirroring edit here.
all = ["eval-toolkit[dataframe,plotting,property,yaml,parquet,validation]"]
dev = [
    "eval-toolkit[all]",
    # Dev-only ceiling (2026-06-12): the pytest-mpl visual baselines are
    # rendered under matplotlib 3.10.x; 3.11.0 renders differently and
    # fails all 10 baseline comparisons. Library extras keep the >=3.8
    # floor (no consumer ceiling). Lift after regenerating baselines
    # under 3.11 — tracked in #117.
    "matplotlib<3.12",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mpl>=0.16",
    "pytest-benchmark>=4.0",  # v0.29.0 (Tier γ #1): perf regression detection on math kernels
    "sybil>=10.0",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/brandon-behring/eval-toolkit"
Documentation = "https://brandon-behring.github.io/eval-toolkit/"
Repository = "https://github.com/brandon-behring/eval-toolkit.git"
Issues = "https://github.com/brandon-behring/eval-toolkit/issues"
Changelog = "https://github.com/brandon-behring/eval-toolkit/blob/main/CHANGELOG.md"

[project.scripts]
eval-toolkit = "eval_toolkit.__main__:main"

[tool.hatch.version]
path = "src/eval_toolkit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_toolkit"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "STYLE.md",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# preview + explicit-preview-rules: enable ONLY the explicitly selected
# preview rules (PLW1514 implicit-encoding, #97) — no other preview-mode
# behavior changes. Locks the Windows-cp1252 mojibake class out permanently.
preview = true
explicit-preview-rules = true
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PLW1514", "S101"]
ignore = [
    "E501",   # line length handled by black
    "N803",   # function arg lowercase — math kernels use π, T, etc. per Decision 14
    "N806",   # variable name lowercase — same reason
]

[tool.ruff.lint.per-file-ignores]
# S101: pytest's assert-based idiom is the point of tests; the §6 assert
# ban (stripped under python -O) applies to src/ + scripts/ only (#103).
"tests/**/*.py" = ["ARG001", "ARG002", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["eval_toolkit"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "matplotlib.*", "pandas.*", "yaml.*", "sentence_transformers.*", "joblib.*", "torch.*", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "README.md", "docs/source"]

python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
markers = [
    "unit: Sklearn-reference and analytical correctness tests",
    "property: Hypothesis property-based invariant tests",
    "smoke: End-to-end smoke tests",
    "golden: Snapshot tests for deterministic outputs (docs renderer, bootstrap CI numerical pins, public API surface).",
    "slow: Tests > 2s (bootstrap-t studentized, multi-seed K-fold). Opt out with `pytest -m 'not slow'`.",
    "monte_carlo: Monte Carlo calibration suite (~14 min). Skipped in PR CI; runs only in the nightly-mc workflow via `-m monte_carlo`.",
    "benchmark: pytest-benchmark perf-regression tests on math kernels. Skipped in PR CI; runs in the nightly-benchmarks workflow via `-m benchmark`. Per v0.29.0 plan Tier γ #1.",
    "integration: Network-dependent integration tests (HF Hub API, Croissant endpoints, etc.). Excluded from PR CI to avoid network-flake; runs in nightly. Opt in via `-m integration`. Added v0.41.0 (#42 Croissant Gate 4).",
]

[tool.coverage.run]
source = ["src/eval_toolkit"]
branch = true

[tool.coverage.report]
# Raised to 92 in v0.10.0 after the per-module coverage chase (every
# src/eval_toolkit/*.py now ≥90% individually; aggregate ~95%).
# Restored to 90 in v0.7.1, was 85 temporarily in v0.7.0.
fail_under = 92
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
