[tox]
# Local-runnable multi-Python test matrix. CI is intentionally external —
# the toolkit is private and home-designed; this config lets contributors
# run `tox` to verify the suite under multiple Python versions when those
# interpreters are available.
envlist = py{311,312,313}, lint, type
isolated_build = true

[testenv]
description = Run pytest + doctests on Python {basepython}
extras = dev
# The doctest invocation reads the canonical module list from
# .doctest-modules (shared with Makefile / noxfile.py / ci.yml). Tox
# commands can't easily slurp a file inline, so we use a one-liner
# `python -c` that does the read + subprocess.check_call dance.
commands =
    pytest --cov=eval_toolkit --cov-fail-under=92 {posargs}
    python -c "from pathlib import Path; import subprocess; subprocess.check_call(['pytest', '--doctest-modules', *Path('.doctest-modules').read_text().split()])"

[testenv:lint]
description = Lint (ruff + black)
extras = dev
commands =
    ruff check src tests scripts
    black --check src tests scripts

[testenv:type]
description = Static type-check (mypy strict)
extras = dev
commands = mypy src scripts

[testenv:visual]
description = pytest-mpl visual-regression check against baseline PNGs
extras = dev
commands = pytest --mpl tests/test_plotting_visual.py
